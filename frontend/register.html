<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Registration</title>

<style>
body{
margin:0;
font-family:Arial,sans-serif;
background:#f5f5f5;
text-align:center;
}

.header{
background:#0a7cff;
color:white;
padding:20px;
font-size:30px;
font-weight:bold;
}

.card{
background:white;
margin:20px auto;
padding:20px;
max-width:400px;
border-radius:15px;
box-shadow:0 2px 10px rgba(0,0,0,.2);
}

input{
width:90%;
padding:15px;
margin:10px 0;
font-size:18px;
border-radius:10px;
border:1px solid #ccc;
}

button{
width:95%;
padding:15px;
background:#0a7cff;
color:white;
font-size:18px;
border:none;
border-radius:10px;
cursor:pointer;
}

#msg{
margin-top:15px;
font-weight:bold;
}
</style>
</head>

<body>

<div class="header">
Nighasan Schools
</div>

<div class="card">

<h2>Student Registration</h2>

<input id="name" type="text" placeholder="Full Name">

<input id="phone" type="text" placeholder="Mobile Number">

<input id="password" type="password" placeholder="Password">

<button onclick="registerStudent()">
Register
</button>

<p id="msg"></p>

</div>

<script src="register.js"></script>

</body>
</html>
