<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Dashboard</title>

<style>
body{
margin:0;
font-family:Arial,sans-serif;
background:#f5f5f5;

.header{

color:white;
padding:20px;
text-align:center;
font-size:28px;
font-weight:bold;
}

.welcome{
padding:20px;
font-size:22px;

}

<body>

</div>

<div class="welcome" id="welcome">

</div>

<div class="card">📚 My Courses</div>

<div class="card">🧪 Online Test</div>

<script src="home.js"></script>

</html>
