<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Create Course</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="main">

<h1>➕ Create New Course</h1>

<input
type="text"
id="title"
placeholder="Course Name">

<input
type="text"
id="teacher"
placeholder="Teacher Name">

<textarea
id="description"
placeholder="Course Description"></textarea>

<h3>Course Thumbnail</h3>

<input
type="file"
id="thumbnail"
accept="image/*">

<br><br>

<img
id="preview"
style="width:250px;border-radius:15px;display:none;">

<br><br>

<h3>Course Banner</h3>

<input
type="file"
id="banner"
accept="image/*">

<br><br>

<img
id="bannerPreview"
style="width:100%;max-width:700px;border-radius:15px;display:none;">

<br><br>

<button onclick="createCourse()">
Create Course
</button>

</div>

<script src="create-course.js"></script>

</body>

</html>
